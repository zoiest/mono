[package]
name = "rustock"
version = "0.1.0"
edition = "2024"
description = "Multi-provider stock data aggregator and web dashboard written in Rust"

[[bin]]
name = "rustock-cli"
path = "src/bin/rustock_cli.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
